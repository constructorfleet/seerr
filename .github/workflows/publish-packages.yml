name: Publish npm packages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - extension-sdk
          - extension-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@constructorfleet'
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Build package
        working-directory: packages/${{ matrix.package }}
        run: pnpm run build
      - name: Publish
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --registry https://registry.npmjs.org/ --no-git-checks
